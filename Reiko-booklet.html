<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reiko · Booklet</title>
<style>
:root{--paper:#f4f1eb;--ink:#49453f;--accent:#aaa091;--line:#d7d1c7;--margin:11;--text-size:14;--font:Georgia,'Songti SC','Noto Serif CJK SC',serif}*{box-sizing:border-box}body{margin:0;background:#e8e5df;color:#45413c;font:14px/1.55 system-ui,sans-serif}button,select,input{font:inherit}button,select{border:1px solid #cbc5bb;background:#faf9f6;border-radius:5px;padding:7px 10px;color:inherit}button{cursor:pointer}button:hover{background:#e9e4da}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #81796a;outline-offset:3px}header{padding:22px 32px 18px;background:#f6f4ef;border-bottom:1px solid #d5cfc5;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;font:normal 25px Georgia,serif;letter-spacing:.03em}.muted{font-size:12px;color:#7f786e}.actions{display:flex;gap:8px;flex-wrap:wrap}.workspace{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 89px)}aside{padding:24px 20px;background:#f1eee8;border-right:1px solid #d5cfc5}aside h2{font-size:12px;font-weight:500;letter-spacing:.1em;margin:0 0 14px}.control{display:block;margin-bottom:18px}.control>span{display:block;font-size:12px;margin-bottom:7px}.control select{width:100%}input[type=range]{width:100%;accent-color:#837968}.note{font-size:12px;color:#7c756b;margin-top:24px;line-height:1.8}.divider{border:0;border-top:1px solid #d5cfc5;margin:24px 0}.main{padding:24px 32px 40px;min-width:0}.bar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.tabs{display:flex;gap:5px}.active{background:#514b43!important;color:white!important;border-color:#514b43!important}.status{font-size:12px;color:#777065}.pages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 18px}.tile{min-width:0}.caption{display:flex;justify-content:space-between;gap:5px;font-size:11px;color:#817a70;margin:8px 2px}.caption button{font-size:11px;padding:2px 5px;background:transparent}.page{background:var(--paper);color:var(--ink);position:relative;aspect-ratio:148/210;overflow:hidden;box-shadow:0 4px 16px #30281b14;font-family:var(--font);container-type:inline-size;cursor:pointer}.page.selected{outline:2px solid #958876;outline-offset:4px}.surface{position:absolute;inset:calc(var(--margin)*1%);display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(20,1fr);gap:2%}.slot{min-width:0;min-height:0;position:relative;border:1px dashed var(--line);outline:none;font-size:calc(var(--text-size)*.24cqw);line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;padding:3%;cursor:text}.slot:empty:before{content:attr(data-hint);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:normal 3.1cqw system-ui,sans-serif;letter-spacing:.07em;color:var(--accent);pointer-events:none}.slot:focus{border-color:var(--accent);background:#ffffff22}.image{padding:0;cursor:pointer}.image img{height:100%;width:100%;object-fit:cover;display:block}.small{font-size:calc(var(--text-size)*.18cqw)}.heading{font-size:calc(var(--text-size)*.45cqw);line-height:1.35}.rule{border-top:1px solid var(--line);grid-column:1/13;grid-row:18;align-self:center}.folio{position:absolute;bottom:3.7%;left:calc(var(--margin)*1%);right:calc(var(--margin)*1%);font:normal 2.5cqw Georgia,serif;color:var(--accent);display:flex;justify-content:space-between}.page:nth-child(even) .folio{text-align:right}.single .pages{display:flex;justify-content:center}.single .tile{width:min(480px,100%)}.spread .pages{display:flex;justify-content:center;gap:2px}.spread .tile{width:min(400px,49%)}.spread .page{box-shadow:0 6px 18px #30281b12}.empty-spread{aspect-ratio:148/210;opacity:0}.hidden{display:none!important}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#514b43;color:#fff;padding:10px 18px;border-radius:6px;box-shadow:0 5px 20px #0002;font-size:13px}.guides-off .slot{border-color:transparent}.guides-off .slot:empty:before{display:none}.guides-off .page.selected{outline:none}.guides-off .image:empty{background:transparent}footer{font-size:12px;color:#847d73;text-align:center;padding:28px 10px 0}.nav{display:flex;gap:6px;align-items:center}.nav button:disabled{opacity:.4;cursor:default}@media(max-width:1100px){.pages{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:780px){header{padding:18px;align-items:flex-start;flex-direction:column}.workspace{display:block}aside{border-right:0;border-bottom:1px solid #d5cfc5;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:0 18px}aside h2,aside .note,aside .divider{grid-column:1/3}.note{margin:0}.control{margin-bottom:12px}.main{padding:20px 15px}.pages{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}.bar{flex-wrap:wrap}.tabs button{font-size:12px}.spread .tile{width:49%}}
@page{size:A5 portrait;margin:0}@media print{body{background:white}header,aside,.bar,.caption,footer,.toast{display:none!important}.workspace,.main,.pages{display:block!important;padding:0!important}.tile{width:148mm!important;height:210mm!important;break-after:page;margin:0!important}.tile:last-child{break-after:auto}.page{width:148mm;height:210mm;box-shadow:none;outline:none!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.slot{border-color:transparent!important}.slot:empty:before{display:none!important}.empty-spread{display:none!important}}
</style></head>
<body><header><div><h1>Reiko / booklet</h1><div class="muted">私人视觉小册子 · 结构与样式第一版</div></div><div class="actions"><button id="save">保存项目</button><button id="load">打开项目</button><button id="print">打印 / 导出 PDF</button></div></header>
<div class="workspace"><aside><h2>视觉系统</h2><label class="control"><span>页数，包含封面与封底</span><select id="count"><option>20</option><option>22</option><option selected>24</option></select></label><label class="control"><span>纸张与墨色</span><select id="tone"><option value="paper">纸白 / 铅灰</option><option value="cool">冷白 / 银灰</option><option value="warm">旧纸 / 褐灰</option></select></label><label class="control"><span>字体</span><select id="font"><option value="serif">衬线</option><option value="sans">无衬线</option></select></label><label class="control"><span>页边距 <output id="marginOut">11%</output></span><input id="margin" type="range" min="7" max="17" value="11"></label><label class="control"><span>文字比例 <output id="sizeOut">14</output></span><input id="size" type="range" min="12" max="20" value="14"></label><hr class="divider"><h2 id="pageLabel">第 01 页</h2><label class="control"><span>当前页版式</span><select id="layout"></select></label><label class="control"><span>辅助框</span><select id="guides"><option value="on">显示空位提示</option><option value="off">只看页面</option></select></label><div class="note">点选一页调整版式。文字框可直接输入；图片框可选择本地图片，再次点击可替换。空位提示不会打印。<br><br>改完请点“保存项目”下载项目文件，下次用“打开项目”恢复。切换页数会暂时收起尾页，内容仍保留。替换版式会保留原内容，匹配到新位置。</div></aside>
<main class="main"><div class="bar"><div class="tabs"><button data-view="overview" class="active">全部页面</button><button data-view="spread">双页</button><button data-view="single">单页</button></div><div class="nav"><button id="prev" aria-label="上一页">上一页</button><span id="position" class="status"></span><button id="next" aria-label="下一页">下一页</button></div></div><div id="pages" class="pages"></div><footer>页面保持空白。仅有版式与空位，没有预写的私人内容。</footer></main></div><input id="imagePicker" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp" hidden><input id="projectPicker" type="file" accept=".json,application/json" hidden><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
// Each rectangle uses a 12-column, 20-row grid. No external dependencies.
const layouts={
cover:{name:'封面 / 中央留白',slots:[['text','标题位置',2,12,7,10,'heading'],['text','小字位置',4,10,14,16,'small']]},
pause:{name:'留白 / 一行文字',slots:[['text','文字位置',2,11,10,13,'heading']]},
fragment:{name:'短句 / 偏置片段',slots:[['text','短句位置',2,12,4,9,'heading'],['text','补充位置',6,13,12,17,'small']]},
image:{name:'图像 / 窄边注记',slots:[['image','图像位置',1,13,2,16],['text','注记位置',1,11,17,19,'small']]},
notes:{name:'记录 / 长短并置',slots:[['text','短句位置',1,12,2,5,'heading'],['text','记录位置',1,9,7,17],['text','侧注位置',10,13,10,17,'small']]},
paired:{name:'碎片 / 两块图像',slots:[['image','图像位置',1,9,2,10],['image','图像位置',5,13,11,18],['text','短注位置',1,5,13,18,'small']]},
archive:{name:'档案 / 小块散置',slots:[['image','图像位置',1,8,2,10],['text','短注位置',9,13,4,10,'small'],['text','记录位置',2,11,12,17]]},
letter:{name:'文字 / 松散段落',slots:[['text','文字位置',2,12,4,17]]},
back:{name:'封底 / 极少文字',slots:[['text','小字位置',4,10,15,18,'small']]}
};
const sequence=['cover','pause','fragment','image','notes','paired','pause','archive','letter','image','fragment','paired','pause','notes','image','archive','letter','paired','fragment','image','pause','notes','pause','back'];
let state={format:'reiko-booklet',version:1,count:24,tone:'paper',font:'serif',margin:11,size:14,pages:sequence.map(layout=>({layout,texts:[],images:[]}))};let current=0,view='overview',targetImage=null;
const $=id=>document.getElementById(id);const tones={paper:['#f4f1eb','#49453f','#aaa091','#d7d1c7'],cool:['#f3f4f4','#4c5158','#a0a6ad','#d5d9de'],warm:['#ede6da','#53493d','#a99b88','#d1c5b5']};
Object.entries(layouts).forEach(([id,l])=>{$('layout').add(new Option(l.name,id))});
function effectiveLayout(i){return i===state.count-1?'back':state.pages[i].layout}
function applyTheme(){const c=tones[state.tone];['--paper','--ink','--accent','--line'].forEach((k,i)=>document.documentElement.style.setProperty(k,c[i]));document.documentElement.style.setProperty('--margin',state.margin);document.documentElement.style.setProperty('--text-size',state.size);document.documentElement.style.setProperty('--font',state.font==='serif'?"Georgia,'Songti SC','Noto Serif CJK SC',serif":"system-ui,'Noto Sans CJK SC',sans-serif");$('marginOut').value=state.margin+'%';$('sizeOut').value=state.size;}
function syncControls(){for(const key of ['count','tone','font','margin'])$(key).value=state[key];$('size').value=state.size;$('layout').value=effectiveLayout(current);$('pageLabel').textContent='第 '+String(current+1).padStart(2,'0')+' 页';$('position').textContent=(current+1)+' / '+state.count;$('prev').disabled=current===0;$('next').disabled=current===state.count-1;applyTheme()}
function makePage(i){const data=state.pages[i],layout=effectiveLayout(i),tile=document.createElement('div');tile.className='tile';const page=document.createElement('article');page.className='page'+(i===current?' selected':'');page.setAttribute('aria-label','第 '+(i+1)+' 页');page.addEventListener('click',()=>{if(current!==i){current=i;document.querySelectorAll('.page').forEach(p=>p.classList.remove('selected'));page.classList.add('selected');syncControls()}});const surface=document.createElement('div');surface.className='surface';let ti=0,ii=0;
layouts[layout].slots.forEach(([kind,hint,c1,c2,r1,r2,extra])=>{const slot=document.createElement('div');slot.className='slot '+(extra||'')+(kind==='image'?' image':'');slot.dataset.hint=hint;slot.style.gridColumn=c1+'/'+c2;slot.style.gridRow=r1+'/'+r2;if(kind==='text'){const index=ti++;slot.contentEditable='true';slot.setAttribute('role','textbox');slot.setAttribute('aria-label',hint);slot.textContent=data.texts[index]||'';slot.addEventListener('input',()=>data.texts[index]=slot.innerText);slot.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))})}else{const index=ii++;if(data.images[index]){const img=document.createElement('img');img.src=data.images[index];img.alt='用户选入的图像';slot.append(img)}slot.tabIndex=0;slot.setAttribute('role','button');slot.setAttribute('aria-label','选择或替换图像');const pick=()=>{targetImage={page:i,index};$('imagePicker').click()};slot.addEventListener('click',pick);slot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}})}surface.append(slot)});page.append(surface);if(layout!=='cover'&&layout!=='back'){const folio=document.createElement('div');folio.className='folio';const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0');folio.append(n);page.append(folio)}tile.append(page);const cap=document.createElement('div');cap.className='caption';const text=document.createElement('span');text.textContent=String(i+1).padStart(2,'0')+' / '+layouts[layout].name;cap.append(text);tile.append(cap);return tile}
function render(){syncControls();const pages=$('pages');pages.replaceChildren();document.querySelector('.main').className='main '+view;if(view==='overview'){for(let i=0;i<state.count;i++)pages.append(makePage(i))}else if(view==='single')pages.append(makePage(current));else{if(current===0||current===state.count-1)pages.append(makePage(current));else{const left=current%2===1?current:current-1;pages.append(makePage(left),makePage(left+1))}}}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),2800)}
for(const key of ['count','tone','font','margin','size'])$(key).addEventListener(key==='margin'||key==='size'?'input':'change',()=>{state[key]=['count','margin','size'].includes(key)?Number($(key).value):$(key).value;current=Math.min(current,state.count-1);if(key==='count')render();else applyTheme()});$('layout').addEventListener('change',()=>{if(current===state.count-1){toast('封底固定为极少文字版式');syncControls();return}state.pages[current].layout=$('layout').value;render()});$('guides').addEventListener('change',()=>document.body.classList.toggle('guides-off',$('guides').value==='off'));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()}));$('prev').onclick=()=>{current=Math.max(0,current-(view==='spread'&&current>1?2:1));render()};$('next').onclick=()=>{current=Math.min(state.count-1,current+(view==='spread'&&current>0?2:1));render()};
$('imagePicker').onchange=()=>{const f=$('imagePicker').files[0];if(!f||!targetImage)return;if(!/^image\/(png|jpeg|webp|gif|avif|bmp)$/.test(f.type)){toast('请选择图片文件');return}const reader=new FileReader();reader.onload=()=>{state.pages[targetImage.page].images[targetImage.index]=reader.result;render();$('imagePicker').value=''};reader.readAsDataURL(f)};
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('save').onclick=()=>{download(JSON.stringify(state,null,2),'Reiko-booklet-project.json','application/json');toast('已下载项目文件')};$('load').onclick=()=>$('projectPicker').click();
$('projectPicker').onchange=async()=>{try{const f=$('projectPicker').files[0];if(!f)return;const s=JSON.parse(await f.text());if(s.format!=='reiko-booklet'||s.version!==1||![20,22,24].includes(s.count)||!tones[s.tone]||!['serif','sans'].includes(s.font)||!Number.isFinite(s.margin)||s.margin<7||s.margin>17||!Number.isFinite(s.size)||s.size<12||s.size>20||!Array.isArray(s.pages)||s.pages.length!==24)throw Error();s.pages.forEach(p=>{if(!layouts[p.layout]||!Array.isArray(p.texts)||!p.texts.every(t=>typeof t==='string')||!Array.isArray(p.images)||!p.images.every(t=>typeof t==='string'&&/^data:image\/(png|jpeg|webp|gif|avif|bmp);base64,/i.test(t)))throw Error()});state=s;current=0;render();toast('已打开项目')}catch{toast('文件不是有效的 booklet 项目')}finally{$('projectPicker').value=''}};
let beforePrintView=null;window.addEventListener('beforeprint',()=>{beforePrintView=view;view='overview';render()});window.addEventListener('afterprint',()=>{if(beforePrintView){view=beforePrintView;beforePrintView=null;render()}});$('print').onclick=()=>window.print();render();
</script></body></html>
